    <line x1="40" x2="662" y1="576" y2="576" stroke="#d8e0ea"/>
    <text x="40" y="608" fill="#647486">Avg winner</text><text x="640" y="608" text-anchor="end" fill="#101827" font-weight="800">0.58%</text>
    <line x1="40" x2="662" y1="624" y2="624" stroke="#d8e0ea"/>
