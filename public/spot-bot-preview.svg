    <text x="716" y="542" fill="#647486">ATR Stop Loss</text><text x="1158" y="542" text-anchor="end" fill="#48596b">4 | -4.00%</text>
    <rect x="716" y="552" width="430" height="8" rx="4" fill="#e5eaf1"/><rect x="716" y="552" width="360" height="8" rx="4" fill="url(#green)"/>
    <text x="716" y="582" fill="#647486">Stale Trade</text><text x="1158" y="582" text-anchor="end" fill="#48596b">3 | -1.53%</text>
    <rect x="716" y="592" width="430" height="8" rx="4" fill="#e5eaf1"/><rect x="716" y="592" width="270" height="8" rx="4" fill="url(#green)"/>
    <text x="716" y="622" fill="#647486">DTP Fallback</text><text x="1158" y="622" text-anchor="end" fill="#48596b">2 | 1.23%</text>
    <rect x="716" y="632" width="430" height="8" rx="4" fill="#e5eaf1"/><rect x="716" y="632" width="180" height="8" rx="4" fill="url(#green)"/>
