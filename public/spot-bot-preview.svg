    <text x="334" y="282" fill="#2b7de9" font-size="30" font-weight="800">1</text>
    <text x="630" y="246" fill="#667789" font-size="11" letter-spacing="1.4">GROSS PNL</text>
    <text x="630" y="282" fill="#d34343" font-size="30" font-weight="800">-0.01%</text>
    <text x="926" y="246" fill="#667789" font-size="11" letter-spacing="1.4">NET PNL</text>
    <text x="926" y="282" fill="#d34343" font-size="30" font-weight="800">-0.21%</text>
    <text x="38" y="350" fill="#667789" font-size="11" letter-spacing="1.4">PNL TODAY</text>
    <text x="38" y="386" fill="#d34343" font-size="30" font-weight="800">-0.21%</text>
    <text x="334" y="350" fill="#667789" font-size="11" letter-spacing="1.4">ROUNDS TODAY</text>
    <text x="334" y="386" fill="#2b7de9" font-size="30" font-weight="800">15</text>
    <text x="630" y="350" fill="#667789" font-size="11" letter-spacing="1.4">WIN RATE</text>
    <text x="630" y="386" fill="#bd8900" font-size="30" font-weight="800">46.67%</text>
