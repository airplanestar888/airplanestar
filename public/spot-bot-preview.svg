    <rect x="318" y="214" width="280" height="92" rx="16" fill="#fff"/>
    <rect x="614" y="214" width="280" height="92" rx="16" fill="#fff"/>
    <rect x="910" y="214" width="268" height="92" rx="16" fill="#fff"/>
    <rect x="22" y="318" width="280" height="92" rx="16" fill="#fff"/>
