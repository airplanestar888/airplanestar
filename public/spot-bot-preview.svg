  <text x="300" y="68" fill="#516070" font-family="Inter, Arial, sans-serif" font-size="13">Asia/Jakarta (GMT+7)</text>
  <rect x="985" y="36" width="52" height="34" rx="10" fill="#f4f7fb" stroke="#d5dee9"/>
