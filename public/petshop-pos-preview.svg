  <path d="M20 730 C250 560 455 680 650 520 C900 315 1050 460 1300 292 C1420 212 1530 220 1600 250" fill="none" stroke="#fff" stroke-width="2" opacity="0.64"/>

  <rect x="82" y="96" width="1436" height="748" rx="31" fill="#ffffff" stroke="#fff7ea" stroke-width="8" filter="url(#shadow)"/>
  <clipPath id="card">
