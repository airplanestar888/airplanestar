    <ellipse cx="284" cy="346" rx="22" ry="24" fill="#141414"/>
    <ellipse cx="357" cy="346" rx="22" ry="24" fill="#141414"/>
    <ellipse cx="322" cy="390" rx="28" ry="20" fill="#23170f"/>
    <path d="M470 360 C440 240 505 175 650 205 C785 235 812 390 752 550 C710 662 560 642 500 545 C472 498 462 430 470 360 Z" fill="#caa06f" opacity="0.86"/>
    <path d="M512 225 C550 155 682 160 724 234 C665 196 565 196 512 225 Z" fill="#ecd2ad" opacity="0.7"/>
    <circle cx="594" cy="348" r="17" fill="#21170f"/>
