      <text x="150" y="535" fill="#fff" font-size="64" font-weight="900">petshop lebih</text>
      <text x="150" y="600" fill="#fff" font-size="64" font-weight="900">cepat, rapi, dan</text>
      <text x="150" y="665" fill="#fff" font-size="64" font-weight="900">terukur.</text>
      <text x="150" y="720" fill="#fff" font-size="22" opacity="0.92">Kasir, stok, member, grooming, hotel, dan laporan</text>
      <text x="150" y="750" fill="#fff" font-size="22" opacity="0.92">penjualan dalam satu web app modern.</text>
