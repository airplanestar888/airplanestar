<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-label="Petshop POS login screen preview">
  <defs>
    <linearGradient id="page" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#fff0d8"/>
      <stop offset="0.52" stop-color="#fff8ef"/>
      <stop offset="1" stop-color="#ffd49a"/>
    </linearGradient>
    <linearGradient id="photo" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#6f5a47"/>
      <stop offset="0.55" stop-color="#9a724d"/>
      <stop offset="1" stop-color="#d4a66e"/>
    </linearGradient>
    <linearGradient id="overlay" x1="0" x2="1">
      <stop offset="0" stop-color="#161616" stop-opacity="0.70"/>
      <stop offset="1" stop-color="#111827" stop-opacity="0.26"/>
    </linearGradient>
    <filter id="shadow" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="0" dy="18" stdDeviation="20" flood-color="#9b6b33" flood-opacity="0.18"/>
    </filter>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
